name: WakaTime Card

on:
    workflow_dispatch:
    schedule:
        - cron: "0 */12 * * *"

permissions:
    contents: write

jobs:
    update-card:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Generate WakaTime card
              env:
                  WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
              run: python scripts/wakatime-card.py

            - name: Commit card
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add assets/wakatime-card.svg
                  git diff --cached --quiet || git commit -m "update WakaTime card"
                  git push
